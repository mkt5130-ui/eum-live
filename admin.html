<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인천e음 관리자</title><link rel="stylesheet" href="./styles.css"></head><body><div class="wrap">
<header class="top"><div class="brand"><span class="badge">ADMIN</span><h1>인천e음 행사 관리자</h1><p>질문 고정·숨김·답변완료·접수마감</p></div></header>
<section id="login" class="card" style="max-width:520px;margin:40px auto"><h2>관리자 패스코드</h2><p class="help">운영진에게만 공유하세요.</p><input id="pass" type="password" placeholder="패스코드"><button id="loginBtn" class="primary" style="margin-top:12px">관리 화면 열기</button><div id="loginMsg" class="help" style="margin-top:10px"></div></section>
<main id="panel" class="hidden"><div class="stats"><div class="stat">키워드<b id="kstat">0</b></div><div class="stat">질문<b id="qstat">0</b></div><div class="stat">총 공감<b id="lstat">0</b></div></div>
<section class="card" style="margin-bottom:18px"><div class="between"><div><h2>접수 상태</h2><p id="openText" class="help"></p></div><div class="row"><button id="toggleOpen"></button><button id="reset" class="danger">전체 데이터 초기화</button></div></div></section>
<section class="grid"><div class="card"><h2>워드클라우드</h2><div id="cloud" class="cloud"></div></div><div class="card"><div class="between"><h2>질문 관리</h2><select id="sort" style="width:auto"><option value="popular">공감순</option><option value="latest">최신순</option></select></div><div id="questions" class="q-list" style="margin-top:14px"></div></div></section>
<section class="card" style="margin-top:18px"><div class="between"><div><h2>참여 소감</h2><p class="help">③번 문항에 남긴 자유 의견입니다.</p></div><span id="fstat" class="badge">0건</span></div><div id="feedbackList" class="q-list"></div></section>
</main></div><script type="module" src="./admin.js"></script></body></html>
